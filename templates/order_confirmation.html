<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order confirmation | LUMIAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>:root{--ivory:#f8f3e9;--paper:#fffdf9;--gold:#c9a36b;--deep:#a87942;--ink:#24211d;--muted:#746b60;--line:rgba(36,33,29,.14);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans)}.shell{width:min(100% - 32px,760px);margin:auto}.brand{display:block;padding:24px 0;font:600 34px var(--serif);letter-spacing:.15em}.brand span{color:var(--deep)}main{background:var(--paper);border:1px solid var(--line);padding:clamp(24px,6vw,54px);margin:34px auto 70px}.mark{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#e8f0e2;color:#355e2f;font-size:26px}.eyebrow{margin-top:24px;color:var(--deep);font-size:10px;text-transform:uppercase;letter-spacing:.22em;font-weight:700}h1{font:400 clamp(42px,7vw,64px)/1 var(--serif);margin:12px 0}p{line-height:1.8;color:var(--muted)}.order-id{background:#f1ebe2;padding:14px;margin:20px 0;font-size:12px;overflow-wrap:anywhere}.items{border-top:1px solid var(--line);margin-top:24px}.item{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding:12px 0}.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding-top:20px}.notice{padding:14px;background:#f2e8d8;color:#65513a;font-size:12px;line-height:1.7}.btn{display:inline-block;background:var(--ink);color:var(--ivory);padding:14px 20px;text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:700;margin-top:22px}.muted{font-size:12px;color:var(--muted)}</style>
</head>
<body data-order-id="{{ order_id }}">
  <div class="shell"><a class="brand" href="/">LUMI<span>AR</span></a>
    <main>
      <div class="mark">✓</div><div class="eyebrow">Order status</div><h1 id="heading">Loading your order…</h1>
      <p id="subheading">We're retrieving your order information.</p>
      <div class="order-id"><strong>Order reference:</strong> <span id="orderId">{{ order_id }}</span></div>
      <div id="notice" class="notice" hidden></div>
      <div class="items" id="items"></div>
      <div class="total"><span>Total</span><span id="total">—</span></div>
      <a class="btn" href="/">Continue shopping</a>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/order_confirmation.js') }}"></script>
</body>
</html>
